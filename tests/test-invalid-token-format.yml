name: Test invalid token format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Deliberately malformed (no recognised prefix): rejected by input
          # validation before any GitHub API request is made.
          token: "not-a-valid-token-prefix"
          dry_run: "true"
      - name: Assert action failed without producing outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-runs-found }}
        run: |
          echo "outcome: $OUTCOME total: '$TOTAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed token"
            exit 1
          fi
          if [ -n "$TOTAL" ]; then
            echo "FAIL: no outputs expected on validation failure"
            exit 1
          fi
          echo "PASS"
