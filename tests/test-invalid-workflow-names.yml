name: Test invalid workflow_names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: "true"
          workflow_names: "CI,bad;name$(x)"
      - name: Assert action failed without producing outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.total-runs-found }}
        run: |
          echo "outcome: $OUTCOME total: '$TOTAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid workflow_names"
            exit 1
          fi
          if [ -n "$TOTAL" ]; then
            echo "FAIL: no outputs expected on validation failure"
            exit 1
          fi
          echo "PASS"
