name: Test custom parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: "true"
          runs_older_than: "30"
          runs_to_keep: "5"

      - name: Assert action ran with custom parameters or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL_FOUND: ${{ steps.action.outputs.total-runs-found }}
          RUNS_DELETED: ${{ steps.action.outputs.runs-deleted }}
          SUCCESSFUL_REQUESTS: ${{ steps.action.outputs.successful-requests }}
          FAILED_REQUESTS: ${{ steps.action.outputs.failed-requests }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total-runs-found: $TOTAL_FOUND"
          echo "runs-deleted: $RUNS_DELETED"
          echo "successful-requests: $SUCCESSFUL_REQUESTS"
          echo "failed-requests: $FAILED_REQUESTS"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom parameters"
            # In dry_run mode, runs-deleted should be 0
            if [ -n "$RUNS_DELETED" ] && [ "$RUNS_DELETED" != "0" ]; then
              echo "FAIL: dry_run mode should not delete any runs, but runs-deleted=$RUNS_DELETED"
              exit 1
            fi
            echo "PASS: dry_run mode with custom params correctly reported 0 deletions"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
