name: Test workflow name filter - validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-invalid-workflow-names
        uses: .
        continue-on-error: true
        with:
          token: "ghp_fakefakefakefakefakefakefakefakefake1"
          owner: "test-owner"
          repo: "test-repo"
          dry_run: "true"
          runs_older_than: "7"
          runs_to_keep: "0"
          workflow_names: "CI,Deploy,Invalid@Name!"

      - name: Assert action failed due to invalid workflow name characters
        env:
          OUTCOME: ${{ steps.action-invalid-workflow-names.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid workflow_names characters, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid workflow_names characters"

      - id: action-invalid-dry-run
        uses: .
        continue-on-error: true
        with:
          token: "ghp_fakefakefakefakefakefakefakefakefake1"
          owner: "test-owner"
          repo: "test-repo"
          dry_run: "maybe"
          runs_older_than: "7"
          runs_to_keep: "0"
          workflow_names: "CI,Deploy,Test"

      - name: Assert action failed due to invalid dry_run value
        env:
          OUTCOME: ${{ steps.action-invalid-dry-run.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid dry_run value, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid dry_run value"

      - id: action-valid-workflow-names
        uses: .
        continue-on-error: true
        with:
          token: "ghp_fakefakefakefakefakefakefakefakefake1"
          owner: "test-owner"
          repo: "test-repo"
          dry_run: "true"
          runs_older_than: "7"
          runs_to_keep: "0"
          workflow_names: "CI,Deploy,Test"

      - name: Assert valid workflow names pass validation (action fails on API, not validation)
        env:
          OUTCOME: ${{ steps.action-valid-workflow-names.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail due to API error (fake token), not validation error
          # This confirms workflow_names validation passed
          echo "PASS: workflow_names validation passed (action failed at API stage as expected)"
