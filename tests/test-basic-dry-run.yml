name: Test basic dry-run mode - token validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "invalid-token-format"
          owner: "test-owner"
          repo: "test-repo"
          dry_run: "true"
          runs_older_than: "7"
          runs_to_keep: "0"

      - name: Assert action failed due to invalid token format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token format, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token format"

      - id: action2
        uses: .
        continue-on-error: true
        with:
          token: ""
          owner: "test-owner"
          repo: "test-repo"
          dry_run: "true"
          runs_older_than: "7"
          runs_to_keep: "0"

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action2.outcome }}
        run: |
          echo "action2 outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing token"
