# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
name: Check Dist

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Set Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies and Rebuild the dist/ directory
        run: |
          npm ci
          npm run build --if-present

      - name: Compare the expected and actual dist/ directories
        continue-on-error: true
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff --name-only
            exit 1
          fi

      # If index.js was different than expected, upload the expected version as an artifact
      - name: Commit files # commit the new dist folder
        if: ${{ steps.diff.outcome == 'failure' }}
        run: |
          git config --local user.email "igorjs@users.noreply.github.com"
          git config --local user.name "GitHub Action CI"
          git add ./dist
          git commit -m "chore(ci): update dist folder"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
